import org.jetbrains.kotlin.gradle.dsl.KotlinVersion

plugins {
    alias(libs.plugins.android.library)
    alias(libs.plugins.maven.publish)
}


android {
    namespace 'com.bmit.lib_core'
    compileSdk 34

    defaultConfig {
        minSdk 30
        targetSdk 34

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            optimization {
                enable false
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
    }

    publishing {
        singleVariant('release') {
            withSourcesJar()
        }
    }
}
kotlin {
    compilerOptions {
        // 强制让 2.2.10 编译器输出兼容 2.0 的字节码格式
        languageVersion.set(KotlinVersion.KOTLIN_2_0)
        apiVersion.set(KotlinVersion.KOTLIN_2_0)
    }
}

// jitpack方式
afterEvaluate {
    publishing {
        publications {
            // 这里的名称 release 必须与 components.release 对应
            release(MavenPublication) {
                from components.release // 如果是纯 Kotlin/Java 模块请改为 components.java

                // 显式指定 artifactId，这样 JitPack 才会识别到子模块
                groupId = 'com.github.HuaiJunHu.BaseApp'
                artifactId = 'lib_core'
                version = '1.0.0'
            }
        }
    }
}


